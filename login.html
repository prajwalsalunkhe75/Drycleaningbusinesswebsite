<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    
</head>
<body class="login-body">

    <nav class="navbar navbar-expand-lg navbar-light fixed-top">

  <div class="container">
    
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <i class="bi bi-droplet-half me-2"></i>
      Angel's Dry Cleaners
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

      
   <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">login</a></li>
                    <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
                </ul>
                
            </div>

  </div>
</nav>


    <div class="login-card fade-up-animation">
        
        <div class="text-center mb-4">
            <div class="login-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="fw-bold" style="color: var(--text-dark);">Welcome Back</h2>
            <p class="text-muted small">Please enter your details to access the dashboard.</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label text-muted small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3 text-muted ps-3">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" class="form-control border-start-0 rounded-end-3 ps-2" id="email" placeholder="angels@gmail.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-muted small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3 text-muted ps-3">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" class="form-control border-start-0 rounded-end-3 ps-2" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">
                    Sign In <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </div>

            <div class="text-center">
                <a href="index.html" class="text-decoration-none small" style="color: var(--primary-dark);">
                    ← Back to Website
                </a>
            </div>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Simple animation trigger
        document.querySelector('.login-card').style.animation = "fadeUp 0.6s ease-out forwards";

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Visual feedback button loading state
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;

            setTimeout(() => {
                if(email && password) {
                    window.location.href = "dashboard.html"; 
                } else {
                    alert("Please fill in all fields.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 800); // Fake delay for realism
        });
    </script>

</body>
</html>
